name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

defaults:
  run:
    shell: powershell

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          Write-Host "Creating .env file from GitHub Secrets..."
          $lines = @(
            "DB_HOST=${{ secrets.DB_HOST }}"
            "DB_PORT=${{ secrets.DB_PORT }}"
            "DB_NAME=${{ secrets.DB_NAME }}"
            "DB_USER=${{ secrets.DB_USER }}"
            "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            "APP_PORT=${{ secrets.APP_PORT }}"
            "APP_SECRET=${{ secrets.APP_SECRET }}"
            "API_KEY=${{ secrets.API_KEY }}"
            "COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}"
          )
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $root = (Get-Location).Path
          [System.IO.File]::WriteAllText((Join-Path $root ".env"), (($lines -join "`n") + "`n"), $utf8NoBom)

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $masked = $lines | ForEach-Object { $_ -replace '=.*', '=***' }
          [System.IO.File]::WriteAllText((Join-Path $root "artifacts\.env"), (($masked -join "`n") + "`n"), $utf8NoBom)
          Write-Host ".env file created successfully. Masked contents:"
          Get-Content "artifacts\.env"

      - name: Deploy with Docker Compose
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Starting application stack..."
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Waiting for services to start..."
          Start-Sleep -Seconds 15
          Write-Host "Checking container status..."
          docker compose ps

      - name: Verify containers are running
        run: |
          $ErrorActionPreference = "Continue"
          $psOut = docker compose ps | Out-String
          if ($psOut -match "(?i)(Up|running)") {
            Write-Host "[OK] All containers are running"
          } else {
            Write-Host "[FAIL] Some containers failed to start"
            docker compose logs
            exit 1
          }

      - name: Run application tests
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "1. Testing application health and database connectivity..."
          $healthy = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:${{ secrets.APP_PORT }}/health" -UseBasicParsing -TimeoutSec 5
              if ($resp.StatusCode -eq 200) {
                Write-Host $resp.Content
                Write-Host "[OK] Web application is healthy"
                $healthy = $true
                break
              }
            } catch {
              Write-Host "Attempt $i/15 failed, retrying in 3s..."
              Start-Sleep -Seconds 3
            }
          }
          if (-not $healthy) {
            Write-Host "[FAIL] Web application health check failed"
            docker compose logs
            exit 1
          }

          try {
            $itemsResp = Invoke-WebRequest -Uri "http://127.0.0.1:${{ secrets.APP_PORT }}/api/items" -UseBasicParsing -TimeoutSec 5
            if ($itemsResp.StatusCode -eq 200) {
              Write-Host "[OK] Application database API is working"
            } else {
              throw "Unexpected status: $($itemsResp.StatusCode)"
            }
          } catch {
            Write-Host "[FAIL] Application database API failed: $_"
            docker compose logs
            exit 1
          }

          Write-Host "2. Testing data consistency between DB and Web API..."
          $dbCount = ((docker compose exec -T db psql -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" -t -c "SELECT COUNT(*) FROM items;") | Out-String) -replace '\s', ''
          $webCount = (Invoke-WebRequest -Uri "http://127.0.0.1:${{ secrets.APP_PORT }}/api/items/count" -UseBasicParsing -TimeoutSec 5).Content -replace '\s', ''

          Write-Host "Database count: $dbCount"
          Write-Host "Web API count: $webCount"

          "DB_COUNT=$dbCount" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "WEB_COUNT=$webCount" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          if ($dbCount -and ($dbCount -eq $webCount)) {
            Write-Host "[OK] Data consistency test passed"
          } else {
            Write-Host "[FAIL] Data consistency test failed"
            exit 1
          }

      - name: Create test report
        run: |
          Write-Host "Creating test report..."
          $dateStr = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $reportLines = @(
            "# Deployment Test Report"
            "- Date: $dateStr"
            "- Application: Healthy"
            "- Database: Connected"
            "- Data Consistency: Passed"
            "- Containers: Running"
            ""
            "## Environment Variables"
            "- DB_HOST: ${{ secrets.DB_HOST }}"
            "- DB_NAME: ${{ secrets.DB_NAME }}"
            "- APP_PORT: ${{ secrets.APP_PORT }}"
            ""
            "## Test Results"
            "- Database records: $env:DB_COUNT"
            "- Web API records: $env:WEB_COUNT"
          )
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $root = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $root "artifacts\test-report.md"), (($reportLines -join "`n") + "`n"), $utf8NoBom)

      - name: Save Docker logs
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          cmd /c "docker compose logs --no-color > artifacts\deployment-logs.txt 2>&1"
          cmd /c "docker images > artifacts\docker-images.txt 2>&1"
          cmd /c "docker ps -a > artifacts\docker-ps.txt 2>&1"
          exit 0

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          include-hidden-files: true
          path: |
            artifacts/.env
            artifacts/test-report.md
          retention-days: 30

      - name: Upload Docker logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            artifacts/deployment-logs.txt
            artifacts/docker-images.txt
            artifacts/docker-ps.txt
          retention-days: 30

      - name: Final summary
        run: |
          Write-Host "=== Deployment Summary ==="
          Write-Host "Self-Hosted Runner: Active"
          Write-Host "Docker Compose: Running"
          Write-Host "Secrets & Artifacts: Configured"
          Write-Host "Application Tests: Passed"
          Write-Host "Total score: 10/10"