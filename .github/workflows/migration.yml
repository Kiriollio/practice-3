name: Migrate Mattermost MySQL to PostgreSQL

on:
  push:
    branches:
      - migration
  workflow_dispatch:

defaults:
  run:
    shell: powershell

jobs:
  migrate:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production .env file
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          [System.IO.File]::WriteAllText("$PWD\.env", "DB_POSTGRES_PASSWORD=$($env:DB_POSTGRES_PASSWORD)`n")

      - name: Backup MySQL database
        env:
          DB_MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
        run: |
          $running = docker ps --format "{{.Names}}"
          if ($running -notcontains "mattermost-mysql") {
            docker start mattermost-mysql
            Start-Sleep -Seconds 10
          }
          New-Item -ItemType Directory -Force -Path backups | Out-Null
          docker exec -e MYSQL_PWD="$env:DB_MYSQL_ROOT_PASSWORD" mattermost-mysql sh -c "mysqldump -u root --single-transaction --routines --triggers mattermost > /tmp/mattermost_mysql_backup.sql"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker cp mattermost-mysql:/tmp/mattermost_mysql_backup.sql backups/mattermost_mysql_backup.sql
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item backups/mattermost_mysql_backup.sql | Select-Object Name, Length

      - name: Stop and remove legacy Mattermost container
        run: |
          $ErrorActionPreference = "Continue"
          docker stop mattermost 2>$null
          docker rm mattermost 2>$null
          exit 0

      - name: Start PostgreSQL and prepare clean schema
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          docker compose -f docker-compose.prod.yml up -d mattermost-postgres
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ready = $false
          for ($i = 1; $i -le 30; $i++) {
            docker exec mattermost-postgres pg_isready -h 127.0.0.1 -U mmuser -d mattermost
            if ($LASTEXITCODE -eq 0) {
              docker exec -e PGPASSWORD="$env:DB_POSTGRES_PASSWORD" mattermost-postgres psql -h 127.0.0.1 -U mmuser -d mattermost -c "SELECT 1;"
              if ($LASTEXITCODE -eq 0) {
                Write-Host "PostgreSQL is ready!"
                $ready = $true
                break
              }
            }
            Write-Host "Waiting for PostgreSQL... ($i/30)"
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Write-Error "PostgreSQL did not become ready in time!"
            exit 1
          }
          docker exec -e PGPASSWORD="$env:DB_POSTGRES_PASSWORD" mattermost-postgres psql -h 127.0.0.1 -U mmuser -d mattermost -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Initialize Mattermost 9.5 schema in PostgreSQL
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          docker run --rm `
            --network mattermost_network `
            --entrypoint /mattermost/bin/mattermost `
            -e MM_SQLSETTINGS_DRIVERNAME=postgres `
            -e "MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:$($env:DB_POSTGRES_PASSWORD)@mattermost-postgres:5432/mattermost?sslmode=disable&connect_timeout=10" `
            mattermost/mattermost-team-edition:9.5 `
            db init

      - name: Migrate data from MySQL to PostgreSQL via pgloader
        env:
          DB_MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          $loadContent = @"
          LOAD DATABASE
               FROM mysql://root:$($env:DB_MYSQL_ROOT_PASSWORD)@mattermost-mysql:3306/mattermost
               INTO postgresql://mmuser:$($env:DB_POSTGRES_PASSWORD)@mattermost-postgres:5432/mattermost

          WITH include no drop,
               truncate,
               create no tables,
               create no indexes,
               reset sequences,
               downcase identifiers

          SET PostgreSQL PARAMETERS
               maintenance_work_mem to '512MB',
               work_mem to '48MB'

          CAST
               type int when (= precision 11) to integer drop typemod,
               type bigint when (= precision 20) to bigint drop typemod,
               type text to varchar drop typemod,
               type tinyint to boolean using tinyint-to-boolean

          EXCLUDING TABLE NAMES MATCHING 'db_migrations', 'db_lock'

          ALTER SCHEMA 'mattermost' RENAME TO 'public'
          ;
          "@
          $loadContent = $loadContent -replace "`r`n", "`n"
          [System.IO.File]::WriteAllText("$PWD\migration.load", $loadContent)

          docker run --rm `
            --network mattermost_network `
            -v "${PWD}\migration.load:/migration.load:ro" `
            dimitri/pgloader:latest `
            pgloader /migration.load
          $exitCode = $LASTEXITCODE
          Remove-Item -Force migration.load -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Verify migrated row counts in PostgreSQL
        env:
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          docker exec -e PGPASSWORD="$env:DB_POSTGRES_PASSWORD" mattermost-postgres psql -h 127.0.0.1 -U mmuser -d mattermost -c "SELECT 'users' AS table_name, COUNT(*) FROM users UNION ALL SELECT 'teams', COUNT(*) FROM teams UNION ALL SELECT 'channels', COUNT(*) FROM channels UNION ALL SELECT 'posts', COUNT(*) FROM posts UNION ALL SELECT 'fileinfo', COUNT(*) FROM fileinfo;"

      - name: Deploy new Mattermost on PostgreSQL
        run: |
          docker compose -f docker-compose.prod.yml up -d

      - name: Healthcheck Mattermost API
        run: |
          for ($i = 1; $i -le 36; $i++) {
            try {
              $res = Invoke-RestMethod -Uri "http://localhost:8065/api/v4/system/ping" -TimeoutSec 5
              if ($res.status -eq "OK") {
                Write-Host "Mattermost on PostgreSQL is UP and Healthy!"
                exit 0
              }
            } catch {
              Write-Host "Waiting for Mattermost... ($i/36)"
            }
            Start-Sleep -Seconds 5
          }
          Write-Host "Mattermost did not become ready in time!"
          docker logs mattermost --tail 50
          exit 1

      - name: Stop legacy MySQL container
        run: |
          docker stop mattermost-mysql